services:
  redis:
    image: redis:7-alpine
    container_name: redis-with-docker
    ports: 
      - "6379:6379"
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
  
  mongo:
    image: mongo:7
    container_name: mongo-with-docker
    ports: 
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: redis_with_docker
    volumes:
      - mongo-data:/data/db

volumes:
  redis-data:
  mongo-data: